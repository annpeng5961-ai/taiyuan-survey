<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>太原養生會館 滿意度調查</title>
<style>
  :root{--pink:#fbd9d6;--pink-d:#b5453d;--blue:#cfe6f5;--blue-d:#2f6f9f;--bg:#faf6ef;--ink:#3a2f26}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC","Noto Sans JP","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#8a3b32;color:#fff;padding:12px 16px;text-align:center;position:relative}
  header h1{margin:0;font-size:22px}
  header .date{margin-top:4px;font-size:18px;color:#ffe9a8}
  .langs{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .langs button{padding:6px 14px;font-size:15px;border-radius:16px;border:1px solid #ffe9a8;background:transparent;color:#ffe9a8;cursor:pointer}
  .langs button.on{background:#ffe9a8;color:#8a3b32;font-weight:bold}
  nav{display:flex;background:#fff;border-bottom:2px solid #ddd}
  nav button{flex:1;padding:14px 4px;font-size:17px;border:0;background:none;cursor:pointer}
  nav button.on{border-bottom:4px solid #8a3b32;font-weight:bold;color:#8a3b32}
  main{max-width:820px;margin:auto;padding:14px}
  section{display:none}
  section.on{display:block}
  .card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px #0002}
  h2{margin:0 0 10px;font-size:19px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 16px;border-radius:24px;border:2px solid #8a3b32;background:#fff;font-size:20px;cursor:pointer}
  .chip.sel{background:#8a3b32;color:#fff}
  .chip .x{margin-left:8px;color:#c33;font-weight:bold}
  .chip.sel .x{color:#ffd}
  .pink{background:var(--pink)} .blue{background:var(--blue)}
  .pink h2{color:var(--pink-d)} .blue h2{color:var(--blue-d)}
  .rates{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .rates button{padding:12px 2px;font-size:17px;border-radius:8px;border:2px solid #0003;background:#fff;cursor:pointer}
  .rates button small{display:block;font-size:11px;color:#666}
  .pink .rates button.sel{background:var(--pink-d);color:#fff}
  .blue .rates button.sel{background:var(--blue-d);color:#fff}
  .rates button.sel small{color:#fff}
  .big{width:100%;padding:16px;font-size:20px;background:#8a3b32;color:#fff;border:0;border-radius:10px;cursor:pointer}
  .big:disabled{background:#aaa}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select{font-size:18px;padding:8px;border-radius:6px;border:1px solid #999}
  button.sm{font-size:16px;padding:9px 14px;border-radius:6px;border:1px solid #8a3b32;background:#fff;color:#8a3b32;cursor:pointer}
  button.sm.fill{background:#8a3b32;color:#fff}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{border:1px solid #ccc;padding:6px;text-align:center}
  th{background:#f0e6d6}
  .msg{padding:10px;border-radius:8px;background:#e5f5e0;margin-bottom:10px;display:none}
  .hint{color:#777;font-size:14px}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <div class="date" id="today"></div>
  <div class="langs" id="langs"></div>
</header>
<nav>
  <button data-t="vote" class="on" data-i18n="navVote"></button>
  <button data-t="setup" data-i18n="navSetup"></button>
  <button data-t="stat" data-i18n="navStat"></button>
</nav>
<main>

<!-- 評分 -->
<section id="vote" class="on">
  <div class="msg" id="okmsg" data-i18n="thanks"></div>
  <div class="card">
    <h2 data-i18n="step1"></h2>
    <div class="chips" id="voteChips"></div>
    <div class="hint" id="noToday" style="display:none" data-i18n="noToday"></div>
  </div>
  <div class="card pink">
    <h2 data-i18n="step2"></h2>
    <div class="rates" id="r1"></div>
  </div>
  <div class="card blue">
    <h2 data-i18n="step3"></h2>
    <div class="rates" id="r2"></div>
  </div>
  <button class="big" id="submit" disabled data-i18n="submit"></button>
</section>

<!-- 今日設定 -->
<section id="setup">
  <div class="card">
    <h2 data-i18n="setupTitle"></h2>
    <div class="row">
      <input id="numIn" type="number" min="1" max="99" data-i18n-ph="numPh" style="width:140px">
      <button class="sm fill" id="addNum" data-i18n="add"></button>
    </div>
    <p class="hint" data-i18n="multiHint"></p>
    <div class="chips" id="todayChips" style="margin-top:10px"></div>
    <div class="row" style="margin-top:12px">
      <button class="sm" id="clearToday" data-i18n="clearToday"></button>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="quick"></h2>
    <div class="chips" id="grid" style="gap:5px"></div>
  </div>
</section>

<!-- 統計 -->
<section id="stat">
  <div class="card">
    <h2 data-i18n="statTitle"></h2>
    <div class="row">
      <input type="month" id="month">
      <button class="sm fill" id="dlSummary" data-i18n="dlSummary"></button>
      <button class="sm" id="dlRaw" data-i18n="dlRaw"></button>
    </div>
    <p class="hint" data-i18n="scoreHint"></p>
  </div>
  <div class="card scroll">
    <table id="tbl"></table>
  </div>
  <div class="card">
    <h2 data-i18n="backupTitle"></h2>
    <p class="hint" data-i18n="backupHint"></p>
    <div class="row">
      <button class="sm" id="bk" data-i18n="bk"></button>
      <button class="sm" id="rs" data-i18n="rs"></button>
      <input type="file" id="rsFile" accept=".json" style="display:none">
    </div>
  </div>
</section>

</main>
<script>
const I18N={

  step2:"② 서비스 품질／접객 태도 (분홍 카드)",step3:"③ 마사지 기술 (파란 카드)",submit:"제출",
  setupTitle:"오늘 근무하는 마사지사 번호 (1~99)",numPh:"번호 입력",add:"추가",
  multiHint:"쉼표나 공백으로 구분해 여러 개를 한 번에 입력할 수 있습니다. 예: 11,5,33,66,88",notSet:"오늘은 설정되지 않았습니다",
  clearToday:"오늘 번호 모두 지우기",quick:"빠른 선택 (눌러서 추가／삭제)",statTitle:"월간 통계",
  dlSummary:"통계 CSV 다운로드",dlRaw:"상세 CSV 다운로드",scoreHint:"점수: 최고 5, 좋음 4, 보통 3, 나쁨 2, 최악 1. CSV는 Excel로 열 수 있습니다.",
  backupTitle:"백업",backupHint:"데이터는 이 기기의 브라우저에 저장됩니다. 기기를 바꾸거나 기록을 지우기 전에 백업하세요.",bk:"백업 파일 다운로드",rs:"백업 복원",
  levels:["최고","좋음","보통","나쁨","최악"],
  hNo:"번호",hDays:"근무일수",hCnt:"평가 건수",hAvgS:"서비스 평균",hAvgK:"기술 평균",pS:"서비스",pK:"기술",
  rDate:"날짜",rNo:"번호",rS:"서비스 품질",rK:"기술 평가",rTime:"제출 시간",
  noData:"이번 달 데이터가 없습니다",noMonth:"이번 달 데이터가 없습니다",badNum:"1~99 사이의 번호를 입력하세요",
  confirmClear:"오늘 번호를 모두 지울까요? (제출된 평가는 삭제되지 않습니다)",confirmRestore:"이 기기의 데이터를 덮어씁니다. 계속할까요?",
  restored:"복원 완료",badFile:"백업 파일 형식이 올바르지 않습니다",fSum:"태원만족도통계",fRaw:"태원만족도상세",fBk:"태원백업"}
};
const LV_SCORE=[5,4,3,2,1];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const KEY_D="taiyuan_days", KEY_R="taiyuan_records", KEY_L="taiyuan_lang";
const load=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))||def}catch(e){return def}};
let days=load(KEY_D,{});       // {"2026-11-09":[11,5,...]}
let recs=load(KEY_R,[]);       // [{date,no,service,skill,time}]
const save=()=>{try{localStorage.setItem(KEY_D,JSON.stringify(days));localStorage.setItem(KEY_R,JSON.stringify(recs))}catch(e){}};

let lang="zh";
try{const s=localStorage.getItem(KEY_L);if(s&&I18N[s])lang=s}catch(e){}
const T=()=>I18N[lang];

let today=dstr(new Date());
function showDate(){
  const d=new Date();today=dstr(d);
  $("#today").textContent=d.toLocaleDateString(T().locale,{year:"numeric",month:"long",day:"numeric",weekday:"long"});
}
const todayList=()=>(days[today]||[]).slice().sort((a,b)=>a-b);

// 語言
function buildLangs(){
  const c=$("#langs");c.innerHTML="";
  Object.keys(I18N).forEach(k=>{
    const b=document.createElement("button");b.textContent=I18N[k].label;b.className=k===lang?"on":"";
    b.onclick=()=>{lang=k;try{localStorage.setItem(KEY_L,k)}catch(e){}applyLang()};
    c.appendChild(b);
  });
}
function applyLang(){
  const t=T();
  document.documentElement.lang=t.htmlLang;
  document.title=t.title;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t[e.dataset.i18n]);
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t[e.dataset.i18nPh]);
  buildLangs();showDate();render();
}

// 分頁
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));
  showDate();render();
});

// 評分
let selNo=null,s1=null,s2=null;
function buildRates(el,get,set){
  el.innerHTML="";
  const lv=T().levels;
  LV_SCORE.forEach((sc,i)=>{
    const b=document.createElement("button");
    b.textContent=lv[i];
    b.classList.toggle("sel",get()===sc);
    b.onclick=()=>{set(sc);renderVote()};
    el.appendChild(b);
  });
}
function renderVote(){
  const list=todayList();
  $("#noToday").style.display=list.length?"none":"block";
  const c=$("#voteChips");c.innerHTML="";
  list.forEach(n=>{
    const b=document.createElement("div");b.className="chip"+(n===selNo?" sel":"");b.textContent=n;
    b.onclick=()=>{selNo=n;renderVote()};c.appendChild(b);
  });
  buildRates($("#r1"),()=>s1,v=>s1=v);
  buildRates($("#r2"),()=>s2,v=>s2=v);
  $("#submit").disabled=!(selNo&&s1&&s2);
}
$("#submit").onclick=()=>{
  recs.push({date:today,no:selNo,service:s1,skill:s2,time:new Date().toISOString()});
  save();selNo=s1=s2=null;renderVote();
  const m=$("#okmsg");m.style.display="block";setTimeout(()=>m.style.display="none",2500);
  window.scrollTo(0,0);
};

// 今日設定
function setToday(arr){days[today]=[...new Set(arr)].sort((a,b)=>a-b);if(!days[today].length)delete days[today];save();render()}
function renderSetup(){
  const list=todayList();
  const c=$("#todayChips");c.innerHTML=list.length?"":`<span class="hint">${T().notSet}</span>`;
  list.forEach(n=>{
    const b=document.createElement("div");b.className="chip";b.innerHTML=`${n}<span class="x">✕</span>`;
    b.onclick=()=>setToday(list.filter(x=>x!==n));c.appendChild(b);
  });
  const g=$("#grid");g.innerHTML="";
  for(let n=1;n<=99;n++){
    const b=document.createElement("div");b.className="chip"+(list.includes(n)?" sel":"");
    b.style.cssText="padding:6px 0;width:44px;text-align:center;font-size:16px";b.textContent=n;
    b.onclick=()=>setToday(list.includes(n)?list.filter(x=>x!==n):[...list,n]);g.appendChild(b);
  }
}
$("#addNum").onclick=()=>{
  const nums=$("#numIn").value.split(/[\s,，、]+/).map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=99);
  if(!nums.length){alert(T().badNum);return}
  setToday([...todayList(),...nums]);$("#numIn").value="";
};
$("#numIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("#addNum").click()});
$("#clearToday").onclick=()=>{if(confirm(T().confirmClear))setToday([])};

// 統計
$("#month").value=today.slice(0,7);
function summary(){
  const m=$("#month").value;const map={};
  recs.filter(r=>r.date.startsWith(m)).forEach(r=>{
    const o=map[r.no]||(map[r.no]={no:r.no,n:0,a:0,b:0,days:new Set(),d1:[0,0,0,0,0,0],d2:[0,0,0,0,0,0]});
    o.n++;o.a+=r.service;o.b+=r.skill;o.days.add(r.date);o.d1[r.service]++;o.d2[r.skill]++;
  });
  return Object.values(map).sort((a,b)=>a.no-b.no);
}
function head(){
  const t=T();
  return [t.hNo,t.hDays,t.hCnt,t.hAvgS,t.hAvgK,...t.levels.map(l=>`${t.pS} ${l}`),...t.levels.map(l=>`${t.pK} ${l}`)];
}
function rows(){
  return summary().map(o=>[o.no,o.days.size,o.n,(o.a/o.n).toFixed(2),(o.b/o.n).toFixed(2),
    o.d1[5],o.d1[4],o.d1[3],o.d1[2],o.d1[1],o.d2[5],o.d2[4],o.d2[3],o.d2[2],o.d2[1]]);
}
function renderStat(){
  const r=rows(),h=head();
  $("#tbl").innerHTML="<tr>"+h.map(x=>`<th>${x}</th>`).join("")+"</tr>"+
    (r.length?r.map(x=>"<tr>"+x.map(v=>`<td>${v}</td>`).join("")+"</tr>").join(""):`<tr><td colspan="${h.length}">${T().noData}</td></tr>`);
}
$("#month").onchange=renderStat;
function dl(name,text,type="text/csv"){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:type+";charset=utf-8"}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const csv=a=>a.map(r=>r.join(",")).join("\r\n");
$("#dlSummary").onclick=()=>{
  const r=rows();if(!r.length){alert(T().noMonth);return}
  dl(`${T().fSum}_${$("#month").value}.csv`,csv([head(),...r]));
};
$("#dlRaw").onclick=()=>{
  const m=$("#month").value;const r=recs.filter(x=>x.date.startsWith(m));
  if(!r.length){alert(T().noMonth);return}
  const t=T();const name=v=>t.levels[LV_SCORE.indexOf(v)];
  dl(`${t.fRaw}_${m}.csv`,csv([[t.rDate,t.rNo,t.rS,t.rK,t.rTime],
    ...r.map(x=>[x.date,x.no,name(x.service),name(x.skill),new Date(x.time).toLocaleString(t.locale).replace(/,/g," ")])]));
};
// 備份
$("#bk").onclick=()=>dl(`${T().fBk}_${today}.json`,JSON.stringify({days,recs}),"application/json");
$("#rs").onclick=()=>$("#rsFile").click();
$("#rsFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{
    try{const o=JSON.parse(rd.result.replace(/^﻿/,""));
      if(!confirm(T().confirmRestore))return;
      days=o.days||{};recs=o.recs||[];save();render();alert(T().restored)}
    catch(err){alert(T().badFile)}
  };rd.readAsText(f);
};

function render(){renderVote();renderSetup();renderStat()}
applyLang();
</script>
</body>
</html>
